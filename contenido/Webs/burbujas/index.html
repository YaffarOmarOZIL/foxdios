<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Pop!</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: linear-gradient(#0b6fc4, #42c1f2 60%, #c9f4ff); user-select: none; }
  #marcador { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 8px 22px; border-radius: 20px; color: #fff; font-size: 20px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.6); z-index: 2; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<div id="marcador">Popped: <b id="n">0</b></div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c'), x = c.getContext('2d'), n = document.getElementById('n');
  let W, H, burbujas = [], chispas = [], cuenta = 0;
  const ajustar = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  addEventListener('resize', ajustar); ajustar();
  const nueva = () => ({ x: Math.random() * W, y: H + 40, r: 14 + Math.random() * 30, v: .6 + Math.random() * 1.4, f: Math.random() * 6 });
  for (let i = 0; i < 18; i++) { const b = nueva(); b.y = Math.random() * H; burbujas.push(b); }
  c.addEventListener('pointerdown', e => {
    for (let i = burbujas.length - 1; i >= 0; i--) {
      const b = burbujas[i];
      const bx = b.x + Math.sin(b.f) * 10;
      if (Math.hypot(e.clientX - bx, e.clientY - b.y) < b.r + 4) {
        for (let k = 0; k < 10; k++) chispas.push({ x: bx, y: b.y, vx: Math.cos(k) * 3, vy: Math.sin(k) * 3, t: 1 });
        burbujas[i] = nueva(); n.textContent = ++cuenta; break;
      }
    }
  });
  (function cuadro() {
    x.clearRect(0, 0, W, H);
    for (const b of burbujas) {
      b.y -= b.v; b.f += .03;
      if (b.y < -50) Object.assign(b, nueva());
      const bx = b.x + Math.sin(b.f) * 10;
      const g = x.createRadialGradient(bx - b.r * .3, b.y - b.r * .3, 1, bx, b.y, b.r);
      g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.3, 'rgba(255,255,255,.1)'); g.addColorStop(.9, 'rgba(200,240,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,.8)');
      x.fillStyle = g; x.beginPath(); x.arc(bx, b.y, b.r, 0, 7); x.fill();
    }
    chispas = chispas.filter(s => (s.t -= .03) > 0);
    for (const s of chispas) { s.x += s.vx; s.y += s.vy; x.fillStyle = 'rgba(255,255,255,' + s.t + ')'; x.beginPath(); x.arc(s.x, s.y, 3, 0, 7); x.fill(); }
    requestAnimationFrame(cuadro);
  })();
</script>
</body>
</html>
